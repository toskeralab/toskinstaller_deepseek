[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "toskinstaller"
version = "0.1.0"
description = "Ferramenta portátil para empacotar apps Windows (ToskeraLAB ART/TECH House)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "TBD" }
authors = [
    { name = "ToskeraLAB ART/TECH House" }
]
keywords = ["installer", "packaging", "pyinstaller", "wix", "inno-setup", "windows"]

dependencies = [
    "PySide6>=6.7,<6.9",
    "requests>=2.32,<3",
    "tqdm>=4.66,<5",
    "Pillow>=10,<12",
    "packaging>=24,<25",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-qt>=4,<5",
    "pytest-cov>=5,<6",
    "black>=24,<25",
    "ruff>=0.5,<0.7",
    "mypy>=1.10,<2",
]

[project.scripts]
toskinstaller = "toskinstaller.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
